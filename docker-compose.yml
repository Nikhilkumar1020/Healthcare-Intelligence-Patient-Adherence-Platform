version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: healthcare_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: healthcare_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/indexes.sql:/docker-entrypoint-initdb.d/02_indexes.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: healthcare_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/healthcare_platform
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./rag/chroma_db:/app/rag/chroma_db

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: healthcare_dashboard
    restart: unless-stopped
    depends_on:
      - api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/healthcare_platform
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"

volumes:
  postgres_data:
